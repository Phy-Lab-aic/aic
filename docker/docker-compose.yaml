name: aic
services:
  eval:
    image: ghcr.io/intrinsic-dev/aic/aic_eval
    # image: my-eval:v1
    build:
      dockerfile: docker/aic_eval/Dockerfile
      context: ..
    command: gazebo_gui:=false launch_rviz:=false ground_truth:=false start_aic_engine:=true shutdown_on_aic_engine_exit:=true
    gpus: all
    networks:
      - default
    environment:
      AIC_EVAL_PASSWD: CHANGE_IN_PROD
      AIC_MODEL_PASSWD: CHANGE_IN_PROD
      # AIC_ENABLE_ACL: true
  model:
    # Track B (Phase 4 / Phase 7) submission image — built from
    # docker/my_policy/Dockerfile which layers PaliGemma tokenizer pre-cache
    # (B5) + lerobot ckpt + MyPi05Policy on top of the aic_model base.
    # To swap back to the example policy, change dockerfile to
    # docker/aic_model/Dockerfile and remove the command override.
    image: my-pi05-solution:v1
    build:
      dockerfile: docker/my_policy/Dockerfile
      context: ..
    command: --ros-args -p policy:=aic_example_policies.ros.MyPi05Policy
    gpus: all
    networks:
      - default
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_ROUTER_CHECK_ATTEMPTS: -1
      AIC_ROUTER_ADDR: eval:7447
      AIC_MODEL_PASSWD: CHANGE_IN_PROD
      # AIC_ENABLE_ACL: true
networks:
  default:
    internal: true
