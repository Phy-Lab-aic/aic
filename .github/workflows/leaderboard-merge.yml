name: leaderboard-merge

on:
  push:
    branches:
      - cheatcode-leaderboard
    paths:
      - 'benchmark/submissions/*.yaml'

permissions:
  contents: write

jobs:
  merge-leaderboard:
    name: Merge leaderboard submissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Merge submissions into leaderboard
        run: python3 benchmark/scripts/merge_leaderboard.py

      - name: Verify leaderboard was updated (higher score accepted)
        id: changes
        run: |
          if git diff --quiet benchmark/leaderboard.yaml benchmark/LEADERBOARD.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No leaderboard update — submission score did not exceed existing record."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Leaderboard updated with new high score."
            git diff benchmark/LEADERBOARD.md
          fi

      - name: Commit leaderboard update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/leaderboard.yaml benchmark/LEADERBOARD.md
          git commit -m "Update leaderboard"
          git push

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "## Leaderboard Updated" >> "$GITHUB_STEP_SUMMARY"
            echo "New high score detected and committed to the branch automatically." >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat benchmark/LEADERBOARD.md >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## No Leaderboard Change" >> "$GITHUB_STEP_SUMMARY"
            echo "Submission score did not exceed the existing record. No update needed." >> "$GITHUB_STEP_SUMMARY"
          fi
