name: leaderboard-merge

on:
  push:
    branches:
      - cheatcode-leaderboard
    paths:
      - 'benchmark/submissions/*.yaml'

permissions:
  contents: write

jobs:
  merge-leaderboard:
    name: Merge leaderboard submissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Merge submissions into leaderboard
        run: python3 benchmark/scripts/merge_leaderboard.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet benchmark/leaderboard.yaml benchmark/LEADERBOARD.md && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push updated leaderboard
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmark/leaderboard.yaml benchmark/LEADERBOARD.md
          git commit -m "chore(benchmark): auto-merge leaderboard submissions"
          git push
